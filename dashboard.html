<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa | SMK DIPSA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash{min-height:100vh;background:var(--bg)}
        .dash-header{border-bottom:1px solid var(--line);padding:18px 0}
        .dash-nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
        .dash-user{display:flex;align-items:center;gap:12px}
        .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
        background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800}
        .dash-main{padding:45px 0}
        .welcome{margin-bottom:28px}
        .welcome h1{font-size:clamp(28px,4vw,42px)}
        .welcome p{color:var(--muted);margin-top:7px}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
        .dash-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
        .stat-number{font-size:32px;font-weight:800}
        .stat-label{color:var(--muted);font-size:13px}
        .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .task{display:flex;justify-content:space-between;align-items:center;gap:20px}
        .task h3{font-size:16px;margin-bottom:5px}
        .task p{color:var(--muted);font-size:13px}
        .status{font-size:12px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.06)}
        .message{margin-bottom:20px;padding:12px 14px;border-radius:10px;font-size:13px;display:none}
        .message.show{display:block}
        .message.error{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.35);color:#ffb3ba}
        .logout-btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}
        .logout-btn:hover{border-color:var(--blue)}
        @media(max-width:700px){
            .stats-grid{grid-template-columns:1fr}
            .task{align-items:flex-start;flex-direction:column}
            .dash-nav{align-items:flex-start}
        }
    </style>
</head>
<body>
<div class="dash">
    <header class="dash-header">
        <div class="container dash-nav">
            <a href="index.html" class="brand">
                <span class="brand-mark">D</span>
                <span><strong>SMK DIPSA</strong><small>Learning Center</small></span>
            </a>
            <div class="dash-user">
                <div id="avatar" class="avatar">S</div>
                <div>
                    <strong id="studentName">Memuat...</strong>
                    <small id="studentClass" style="display:block;color:var(--muted)">Memuat kelas...</small>
                </div>
                <button id="logoutButton" class="logout-btn" type="button">Keluar</button>
            </div>
        </div>
    </header>

    <main class="container dash-main">
        <div id="dashboardMessage" class="message"></div>

        <div class="welcome">
            <h1 id="welcomeTitle">Selamat Datang!</h1>
            <p>Dashboard siswa SMK DIPSA.</p>
        </div>

        <div class="stats-grid">
            <div class="dash-card"><div id="classStat" class="stat-number">-</div><div class="stat-label">Kelas Saya</div></div>
            <div class="dash-card"><div id="materialStat" class="stat-number">-</div><div class="stat-label">Materi Kelas</div></div>
            <div class="dash-card"><div id="assignmentStat" class="stat-number">-</div><div class="stat-label">Tugas Kelas</div></div>
        </div>

        <section>
            <div class="section-title"><h2>Tugas Terbaru</h2></div>
            <div id="latestTask" class="dash-card task">
                <div>
                    <h3>Memuat tugas...</h3>
                    <p>Mohon tunggu.</p>
                </div>
                <span class="status">Memuat</span>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const { createClient } = window.supabase;

function getClient() {
    if (!window.SUPABASE_URL || window.SUPABASE_URL.includes("PASTE_") ||
        !window.SUPABASE_PUBLISHABLE_KEY || window.SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")) {
        throw new Error("Konfigurasi Supabase belum diisi di supabase-config.js.");
    }
    return createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
}

function showError(text) {
    const el = document.getElementById("dashboardMessage");
    el.textContent = text;
    el.className = "message show error";
}

async function loadDashboard() {
    try {
        const client = getClient();

        const { data: { session } } = await client.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }

        const userId = session.user.id;

        const { data: profile, error: profileError } = await client
            .from("profiles")
            .select("id, nama, jenis_kelamin, kelas_id, role")
            .eq("id", userId)
            .single();

        if (profileError) throw profileError;

        let className = "-";
        if (profile.kelas_id) {
            const { data: kelas, error: classError } = await client
                .from("classes")
                .select("id, nama_kelas, tingkat, jurusan, tahun_ajaran")
                .eq("id", profile.kelas_id)
                .single();

            if (classError) throw classError;
            className = kelas.nama_kelas;
        }

        const name = profile.nama || session.user.email || "Siswa";
        document.getElementById("studentName").textContent = name;
        document.getElementById("studentClass").textContent = className;
        document.getElementById("welcomeTitle").textContent = "Selamat Datang, " + name + "!";
        document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
        document.getElementById("classStat").textContent = className;

        const { count: materialCount, error: materialError } = await client
            .from("materials")
            .select("id", { count: "exact", head: true })
            .eq("kelas_id", profile.kelas_id);

        if (materialError) throw materialError;
        document.getElementById("materialStat").textContent = materialCount ?? 0;

        const { data: assignments, count: assignmentCount, error: assignmentError } = await client
            .from("assignments")
            .select("id, judul, deskripsi, deadline, status", { count: "exact" })
            .eq("kelas_id", profile.kelas_id)
            .order("deadline", { ascending: true })
            .limit(5);

        if (assignmentError) throw assignmentError;
        document.getElementById("assignmentStat").textContent = assignmentCount ?? 0;

        const latest = document.getElementById("latestTask");
        if (assignments && assignments.length > 0) {
            const task = assignments[0];
            const deadline = task.deadline
                ? new Date(task.deadline).toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" })
                : "Belum ditentukan";

            latest.innerHTML = `
                <div>
                    <h3>${escapeHtml(task.judul || "Tugas")}</h3>
                    <p>Deadline ${escapeHtml(deadline)}</p>
                </div>
                <span class="status">Belum dikumpulkan</span>
            `;
        } else {
            latest.innerHTML = `
                <div>
                    <h3>Belum ada tugas</h3>
                    <p>Belum ada tugas untuk kelas ${escapeHtml(className)}.</p>
                </div>
                <span class="status">Kosong</span>
            `;
        }
    } catch (error) {
        console.error(error);
        showError(error.message || "Dashboard gagal dimuat.");
    }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

document.getElementById("logoutButton").addEventListener("click", async () => {
    try {
        const client = getClient();
        await client.auth.signOut();
    } finally {
        window.location.href = "login.html";
    }
});

loadDashboard();
</script>
</body>
</html>
