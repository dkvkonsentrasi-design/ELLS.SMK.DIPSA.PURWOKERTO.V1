<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Siswa | SMK DIPSA</title>
<link rel="stylesheet" href="style.css">
<style>
.dash{min-height:100vh;background:var(--bg)}
.dash-header{border-bottom:1px solid var(--line);padding:18px 0}
.dash-nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.dash-user{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800}
.dash-main{padding:40px 0 70px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:28px}
.hero h1{font-size:clamp(28px,4vw,42px)}.hero p{color:var(--muted);margin-top:7px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.stat-number{font-size:32px;font-weight:800}.stat-label{color:var(--muted);font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.subject-card{display:block;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.subject-card:hover{transform:translateY(-2px);border-color:var(--blue)}
.subject-card h3{font-size:18px}.subject-card p{color:var(--muted);margin-top:8px;line-height:1.6}
.badge{display:inline-block;font-size:12px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.06);margin-top:14px}
.message{margin-bottom:20px;padding:12px 14px;border-radius:10px;font-size:13px;display:none}.message.show{display:block}.message.error{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.35);color:#ffb3ba}
.logout-btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}
.empty{color:var(--muted);padding:25px 0}
@media(max-width:850px){.subject-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.dash-nav{align-items:flex-start}.dash-user>div:nth-child(2){display:none}.stats-grid,.subject-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style>

<style id="dashboard-spacing-fix">
/* ===== PERBAIKAN JARAK DASHBOARD SISWA ===== */
html, body {
  margin: 0 !important;
  padding: 0 !important;
}

.dash {
  min-height: 100vh !important;
  margin: 0 !important;
  padding: 0 !important;
}

.dash-header {
  height: auto !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 14px 0 !important;
}

.dash-main {
  display: block !important;
  position: relative !important;
  width: auto !important;
  min-height: 0 !important;
  height: auto !important;
  margin: 0 auto !important;
  padding: 22px 0 45px !important;
  transform: none !important;
}

.dash-main > #message {
  margin: 0 0 12px !important;
  padding: 0 !important;
}

.dash-main > .hero {
  display: block !important;
  position: relative !important;
  width: auto !important;
  height: auto !important;
  min-height: 0 !important;
  margin: 0 0 18px !important;
  padding: 0 !important;
  transform: none !important;
}

.dash-main > .hero h1 {
  margin: 0 !important;
  padding: 0 !important;
  line-height: 1.15 !important;
}

.dash-main > .hero p {
  margin: 6px 0 0 !important;
  padding: 0 !important;
}

.stats-grid {
  margin: 0 0 22px !important;
  padding: 0 !important;
  gap: 12px !important;
}

.stats-grid .dash-card {
  margin: 0 !important;
  padding: 18px !important;
}

.dash-main section {
  margin: 0 !important;
  padding: 0 !important;
}

.section-title {
  margin: 0 0 10px !important;
  padding: 0 !important;
}

.subject-grid {
  margin: 0 !important;
  padding: 0 !important;
  gap: 12px !important;
}

.subject-grid .dash-card {
  margin: 0 !important;
  padding: 18px !important;
}

/* Jika style.css memberi jarak/min-height pada container */
.dash-main.container {
  min-height: 0 !important;
}

/* Desktop */
@media (min-width: 651px) {
  .dash-main {
    padding-top: 22px !important;
  }
}

/* Mobile */
@media (max-width: 650px) {
  .dash-main {
    padding-top: 18px !important;
    padding-bottom: 35px !important;
  }

  .stats-grid,
  .subject-grid {
    gap: 10px !important;
  }
}
</style>

</head>
<body>
<div class="dash">
<header class="dash-header"><div class="container dash-nav">
<a href="index.html" class="brand"><span class="brand-mark">D</span><span><strong>SMK DIPSA</strong><small>Learning Center</small></span></a>
<div class="dash-user"><div id="avatar" class="avatar">S</div><div><strong id="studentName">Memuat...</strong><small id="studentClass" style="display:block;color:var(--muted)">Memuat kelas...</small></div><button id="logoutButton" class="logout-btn">Keluar</button></div>
</div></header>
<main class="container dash-main">
<div id="message" class="message"></div>
<div class="hero"><div><h1>Dashboard Siswa</h1><p>Materi dan tugas sesuai kelas kamu.</p></div></div>
<div class="stats-grid">
<div class="dash-card"><div id="statSubjects" class="stat-number">-</div><div class="stat-label">Mata Pelajaran</div></div>
<div class="dash-card"><div id="statAssignments" class="stat-number">-</div><div class="stat-label">Tugas</div></div>
<div class="dash-card"><div id="statMaterials" class="stat-number">-</div><div class="stat-label">Materi</div></div>
</div>
<section><div class="section-title"><h2>Mata Pelajaran Saya</h2></div><div id="subjects" class="subject-grid"><div class="dash-card"><h3>Memuat...</h3><p>Mohon tunggu.</p></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const {createClient}=window.supabase;let client;
function getClient(){if(!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_URL.includes('PASTE_')||window.SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))throw new Error('Konfigurasi Supabase belum diisi di supabase-config.js.');return createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY)}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showError(t){const e=document.getElementById('message');e.textContent=t;e.className='message show error'}
async function init(){try{
 client=getClient();
 const {data:{session}}=await client.auth.getSession();
 if(!session){location.href='login.html';return}
 const {data:p,error:pe}=await client.from('profiles').select('id,nama,kelas_id,role').eq('id',session.user.id).single();
 if(pe)throw pe;
 if(p.role!=='siswa'){location.href='teacher.html';return}
 const name=p.nama||session.user.email||'Siswa';
 document.getElementById('studentName').textContent=name;
 document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();
 const {data:kelas,error:ke}=await client.from('classes').select('id,nama_kelas,tahun_ajaran').eq('id',p.kelas_id).maybeSingle();
 if(ke)throw ke;
 document.getElementById('studentClass').textContent=kelas?.nama_kelas||'Kelas belum ditentukan';
 if(!p.kelas_id){
   document.getElementById('statSubjects').textContent='0';document.getElementById('statAssignments').textContent='0';document.getElementById('statMaterials').textContent='0';
   document.getElementById('subjects').innerHTML='<div class="dash-card"><h3>Kelas belum ditentukan</h3><p>Silakan hubungi Admin agar akun siswa diberi kelas.</p></div>';return;
 }
 const {data:subjects,error:se}=await client.from('subjects').select('id,nama_mapel,kelas_id,guru_id,profiles!subjects_guru_id_fkey(nama),classes(nama_kelas,tahun_ajaran)').eq('kelas_id',p.kelas_id).order('nama_mapel');
 if(se)throw se;
 const list=subjects||[];
 document.getElementById('statSubjects').textContent=list.length;
 let assignments=0,materials=0;
 if(list.length){
   const ids=list.map(s=>s.id);
   const [a,m]=await Promise.all([
     client.from('assignments').select('id',{count:'exact',head:true}).in('mapel_id',ids),
     client.from('materials').select('id',{count:'exact',head:true}).in('mapel_id',ids)
   ]);
   if(a.error)throw a.error;if(m.error)throw m.error;assignments=a.count||0;materials=m.count||0;
 }
 document.getElementById('statAssignments').textContent=assignments;
 document.getElementById('statMaterials').textContent=materials;
 const el=document.getElementById('subjects');
 if(!list.length){el.innerHTML='<div class="dash-card"><h3>Belum ada mata pelajaran</h3><p>Belum ada mata pelajaran yang ditugaskan untuk kelas kamu.</p></div>';return}
 el.innerHTML=list.map(s=>`<a class="dash-card subject-card" href="subject.html?mapel_id=${Number(s.id)}"><h3>${esc(s.nama_mapel)}</h3><p>Guru: ${esc(s.profiles?.nama||'Belum ditentukan')}</p><span class="badge">${esc(s.classes?.nama_kelas||'Kelas kamu')}</span></a>`).join('');
 }catch(e){console.error(e);showError(e.message||String(e))}}
document.getElementById('logoutButton').addEventListener('click',async()=>{try{if(client)await client.auth.signOut()}finally{location.href='login.html'}});init();
</script>
</body></html>
