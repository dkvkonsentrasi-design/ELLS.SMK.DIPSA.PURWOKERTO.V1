<!DOCTYPE html>
<!-- saved from url=(0091)https://dkvkonsentrasi-design.github.io/ELLS.SMK.DIPSA.PURWOKERTO.V1/student-dashboard.html -->
<html lang="id"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Siswa | SMK DIPSA</title>
<link rel="stylesheet" href="./Dashboard Siswa _ SMK DIPSA_files/style.css">
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e7ebf2;
  --blue:#2563eb;--blue2:#4f46e5;--soft:#eef4ff;--green:#16a34a;--shadow:0 10px 30px rgba(23,32,51,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.dash{min-height:100vh}
.dash-header{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.dash-nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text)}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 8px 20px rgba(37,99,235,.22)}
.brand strong{display:block;font-size:15px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.dash-user{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));font-weight:800}
.dash-user strong{display:block;font-size:14px}.dash-user small{font-size:12px}
.logout-btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.2s}
.logout-btn:hover{background:#f8fafc;border-color:#cfd6e2}
.dash-main{padding:34px 0 70px}
.hero{background:linear-gradient(135deg,#1d4ed8,#4f46e5);color:#fff;border-radius:22px;padding:30px 32px;margin-bottom:24px;box-shadow:0 16px 35px rgba(37,99,235,.18);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-80px;background:rgba(255,255,255,.11)}
.hero h1{font-size:clamp(26px,4vw,38px);margin:0;position:relative;z-index:1}.hero p{margin:8px 0 0;color:rgba(255,255,255,.82);position:relative;z-index:1}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:var(--shadow)}
.stats-grid .dash-card{position:relative;overflow:hidden}
.stats-grid .dash-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--blue),var(--blue2))}
.stat-number{font-size:30px;font-weight:850;line-height:1}.stat-label{color:var(--muted);font-size:13px;margin-top:8px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.section-title h2{font-size:20px;margin:0}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.subject-card{display:block;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:180px;position:relative}
.subject-card:hover{transform:translateY(-4px);border-color:#b9c9ff;box-shadow:0 16px 32px rgba(37,99,235,.11)}
.subject-card h3{font-size:17px;line-height:1.35;margin:0;padding-right:5px}
.subject-card p{color:var(--muted);margin:11px 0 0;line-height:1.55;font-size:13px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);margin-top:18px}
.message{margin-bottom:20px;padding:13px 15px;border-radius:12px;font-size:13px;display:none}.message.show{display:block}.message.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}
.empty{color:var(--muted);padding:25px 0}
@media(max-width:900px){.subject-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
  .dash-nav{padding:0 16px}.dash-user>div:nth-child(2){display:none}
  .dash-main{padding:22px 16px 50px}.hero{padding:25px 22px;border-radius:18px}
  .stats-grid,.subject-grid{grid-template-columns:1fr}.stats-grid{gap:12px}
  .subject-card{min-height:auto}.brand small{display:none}
}
</style>
</head>
<body>
<div class="dash">
<header class="dash-header"><div class="container dash-nav">
<a href="https://dkvkonsentrasi-design.github.io/ELLS.SMK.DIPSA.PURWOKERTO.V1/index.html" class="brand"><span class="brand-mark">D</span><span><strong>SMK DIPSA</strong><small>Learning Center</small></span></a>
<div class="dash-user"><div id="avatar" class="avatar">A</div><div><strong id="studentName">Siswa</strong><small id="studentClass" style="display:block;color:var(--muted)">Memuat kelas...</small></div><button id="logoutButton" class="logout-btn">Keluar</button></div>
</div></header>
<main class="container dash-main">
<div id="message" class="message"></div>
<div class="hero"><div><h1>Dashboard Siswa</h1><p>Materi dan tugas sesuai kelas kamu.</p></div></div>
<div class="stats-grid">
<div class="dash-card"><div id="statSubjects" class="stat-number">0</div><div class="stat-label">Mata Pelajaran</div></div>
<div class="dash-card"><div id="statAssignments" class="stat-number">0</div><div class="stat-label">Tugas</div></div>
<div class="dash-card"><div id="statMaterials" class="stat-number">0</div><div class="stat-label">Materi</div></div>
</div>
<section><div class="section-title"><h2>Mata Pelajaran Saya</h2></div><div id="subjects" class="subject-grid"><a class="dash-card subject-card" href="https://dkvkonsentrasi-design.github.io/ELLS.SMK.DIPSA.PURWOKERTO.V1/subject.html?mapel_id=21"><h3>KODING DAN KECERDASAN ARTIFISIAL</h3><p>Guru: Belum ditentukan</p><span class="badge">X MP</span></a></div></section>
</main></div>
<script src="./Dashboard Siswa _ SMK DIPSA_files/supabase-js@2"></script>
<script src="./Dashboard Siswa _ SMK DIPSA_files/supabase-config.js.download"></script>
<script>
const {createClient}=window.supabase;let client;
function getClient(){if(!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_URL.includes('PASTE_')||window.SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))throw new Error('Konfigurasi Supabase belum diisi di supabase-config.js.');return createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY)}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showError(t){const e=document.getElementById('message');e.textContent=t;e.className='message show error'}
async function init(){try{
 client=getClient();
 const {data:{session}}=await client.auth.getSession();
 if(!session){location.href='login.html';return}
 const {data:p,error:pe}=await client.from('profiles').select('id,nama,kelas_id,role').eq('id',session.user.id).single();
 if(pe)throw pe;
 if(p.role!=='siswa'){location.href='teacher.html';return}
 const name=p.nama||session.user.email||'Siswa';
 document.getElementById('studentName').textContent=name;
 document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();
 const {data:kelas,error:ke}=await client.from('classes').select('id,nama_kelas,tahun_ajaran').eq('id',p.kelas_id).maybeSingle();
 if(ke)throw ke;
 document.getElementById('studentClass').textContent=kelas?.nama_kelas||'Kelas belum ditentukan';
 if(!p.kelas_id){
   document.getElementById('statSubjects').textContent='0';document.getElementById('statAssignments').textContent='0';document.getElementById('statMaterials').textContent='0';
   document.getElementById('subjects').innerHTML='<div class="dash-card"><h3>Kelas belum ditentukan</h3><p>Silakan hubungi Admin agar akun siswa diberi kelas.</p></div>';return;
 }
 const {data:subjects,error:se}=await client.from('subjects').select('id,nama_mapel,kelas_id,guru_id,profiles!subjects_guru_id_fkey(nama),classes(nama_kelas,tahun_ajaran)').eq('kelas_id',p.kelas_id).order('nama_mapel');
 if(se)throw se;
 const list=subjects||[];
 document.getElementById('statSubjects').textContent=list.length;
 let assignments=0,materials=0;
 if(list.length){
   const ids=list.map(s=>s.id);
   const [a,m]=await Promise.all([
     client.from('assignments').select('id',{count:'exact',head:true}).in('mapel_id',ids),
     client.from('materials').select('id',{count:'exact',head:true}).in('mapel_id',ids)
   ]);
   if(a.error)throw a.error;if(m.error)throw m.error;assignments=a.count||0;materials=m.count||0;
 }
 document.getElementById('statAssignments').textContent=assignments;
 document.getElementById('statMaterials').textContent=materials;
 const el=document.getElementById('subjects');
 if(!list.length){el.innerHTML='<div class="dash-card"><h3>Belum ada mata pelajaran</h3><p>Belum ada mata pelajaran yang ditugaskan untuk kelas kamu.</p></div>';return}
 el.innerHTML=list.map(s=>`<a class="dash-card subject-card" href="subject.html?mapel_id=${Number(s.id)}"><h3>${esc(s.nama_mapel)}</h3><p>Guru: ${esc(s.profiles?.nama||'Belum ditentukan')}</p><span class="badge">${esc(s.classes?.nama_kelas||'Kelas kamu')}</span></a>`).join('');
 }catch(e){console.error(e);showError(e.message||String(e))}}
document.getElementById('logoutButton').addEventListener('click',async()=>{try{if(client)await client.auth.signOut()}finally{location.href='login.html'}});init();
</script>
</body></html>
